name: Build IPA

# Сборка неподписанного IPA для установки через Sideloadly.
# Запуск вручную: Actions → Build IPA → Run workflow.
# Нужны два секрета репозитория: TG_API_ID и TG_API_HASH (с my.telegram.org).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 340

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app/Contents/Developer"
          xcodebuild -version

      - name: Write configuration
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          # bundle_id и team_id совпадают с профилями из fake-codesigning; Sideloadly заменит их при подписи.
          # Без секретов собирается ПРОБНАЯ сборка на ключах из appstore-configuration.json — на телефон её не ставить.
          python3 - <<'EOF'
          import json, os
          config = json.load(open("build-system/appstore-configuration.json"))
          if os.environ.get("TG_API_ID") and os.environ.get("TG_API_HASH"):
              config["api_id"] = os.environ["TG_API_ID"]
              config["api_hash"] = os.environ["TG_API_HASH"]
          else:
              print("::warning::Секретов TG_API_ID / TG_API_HASH нет: пробная сборка, не для установки")
          json.dump(config, open("build-system/ghostgram-configuration.json", "w"), indent=1)
          EOF

      - name: Pin Xcode and patch submodules
        run: GG_PATCHES_ONLY=1 build-system/GGBuild.sh

      - name: Renew fake provisioning profiles
        # Профили из fake-codesigning просрочены (2026-10-30), plisttool такие не принимает.
        # Переподписываем их тем же самоподписанным сертификатом с новой датой.
        working-directory: build-system/Make
        run: |
          python3 - <<'EOF'
          import os, plistlib, subprocess, datetime, tempfile
          import GenerateProfiles as G
          certs = "../fake-codesigning/certs"
          profiles = "../fake-codesigning/profiles"
          p12 = os.path.join(certs, "SelfSigned.p12")
          identity = G.get_signing_identity_from_p12(p12)
          assert identity, "no signing identity in SelfSigned.p12"
          keychain = G.setup_temp_keychain(p12)
          try:
              for name in sorted(os.listdir(profiles)):
                  if not name.endswith(".mobileprovision"):
                      continue
                  path = os.path.join(profiles, name)
                  data = plistlib.loads(subprocess.check_output(["security", "cms", "-D", "-i", path]))
                  data["ExpirationDate"] = datetime.datetime.utcnow() + datetime.timedelta(days=365)
                  data.pop("DER-Encoded-Profile", None)
                  with tempfile.NamedTemporaryFile(suffix=".plist", delete=False) as f:
                      plistlib.dump(data, f)
                  subprocess.check_call(["security", "cms", "-S", "-k", keychain, "-N", identity, "-i", f.name, "-o", path])
                  os.unlink(f.name)
                  print("renewed", name, data["ExpirationDate"])
          finally:
              G.cleanup_temp_keychain(keychain)
          EOF

      - name: Build
        run: |
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py --overrideXcodeVersion \
            build \
            --configurationPath build-system/ghostgram-configuration.json \
            --codesigningInformationPath build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="${{ github.run_number }}" \
            --outputBuildArtifactsPath build-output/ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Ghostgram-ipa
          path: build-output/ipa/Telegram.ipa
          if-no-files-found: error
          retention-days: 7
